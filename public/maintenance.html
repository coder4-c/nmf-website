<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Website Under Maintenance | Next Mission Fitness</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #000000;
      --ink: #ffffff;
      --dim: rgba(255, 255, 255, 0.5);
      --panel-top: #2a2a2a;
      --panel-bottom: #0e0e0e;
      --line: rgba(255, 255, 255, 0.14);

      --display: "Anton", "Bebas Neue", Impact, "Arial Narrow", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      background: var(--black);
      color: var(--ink);
      font-family: var(--body);
      font-size: 18px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(60% 55% at 85% 22%, rgba(255, 255, 255, 0.16), transparent 70%),
        linear-gradient(160deg, var(--panel-top) 0%, #1a1a1a 55%, var(--panel-bottom) 100%);
      clip-path: polygon(46% 0, 100% 0, 100% 100%, 30% 100%);
      z-index: 0;
    }

    .watermark {
      position: absolute;
      right: -6vw;
      bottom: 6vh;
      font-family: var(--display);
      font-size: clamp(220px, 34vw, 560px);
      line-height: 0.8;
      letter-spacing: -0.02em;
      transform: skewX(-12deg);
      color: transparent;
      background: linear-gradient(90deg, rgba(255,255,255,0.10) 0 33%, rgba(255,255,255,0.20) 33% 66%, rgba(255,255,255,0.07) 66% 100%);
      -webkit-background-clip: text;
      background-clip: text;
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }

    header, main, footer { position: relative; z-index: 1; }

    .wrap {
      width: min(1150px, 100% - 48px);
      margin-inline: auto;
    }

    header { border-bottom: 1px solid var(--line); }
    header .wrap { padding: 26px 0; }

    /* Swap this block for your real logo:
       <img src="/your-logo.png" alt="Next Mission Fitness" height="44"> */
    .brand {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1;
      text-decoration: none;
      color: var(--ink);
      transform: skewX(-8deg);
    }
    .brand .mark {
      font-family: var(--display);
      font-size: 40px;
      letter-spacing: 0.02em;
    }
    .brand .name {
      font-family: var(--display);
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .brand .name em { font-style: normal; color: var(--dim); }

    main {
      flex: 1;
      display: flex;
      align-items: center;
    }
    .hero { padding: clamp(56px, 12vh, 140px) 0; }

    h1 {
      margin: 0 0 36px;
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(48px, 9.5vw, 128px);
      line-height: 0.96;
      letter-spacing: -0.01em;
      text-transform: uppercase;
    }
    h1 span { display: block; }
    h1 .dim { color: var(--dim); }

    .hero p {
      max-width: 32em;
      margin: 0 0 18px;
    }

    footer { border-top: 1px solid var(--line); }
    footer .wrap {
      padding: 22px 0;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
    }

    @media (max-width: 720px) {
      body { font-size: 16px; }
      header .wrap { padding: 20px 0; }
      .page::before { clip-path: polygon(55% 0, 100% 0, 100% 100%, 20% 100%); }
      .watermark { bottom: 12vh; opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="watermark" aria-hidden="true">NMF</div>

    <header>
      <div class="wrap">
        <a class="brand" href="/" aria-label="Next Mission Fitness">
          <span class="mark">NMF</span>
          <span class="name">Next <em>Mission</em> Fitness</span>
        </a>
      </div>
    </header>

    <main>
      <div class="wrap hero">
        <h1>
          <span class="dim">Website Under</span>
          <span>Maintenance</span>
        </h1>

        <p>We are currently performing scheduled maintenance and updates on this website.</p>
        <p>We apologize for the inconvenience. Please check back soon.</p>
      </div>
    </main>

    <footer>
      <div class="wrap">Next Mission Fitness Coming Back Soon</div>
    </footer>
  </div>
</body>
</html>
